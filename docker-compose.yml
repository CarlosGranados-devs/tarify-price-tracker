services:
  db:
    image: postgres:15-alpine
    container_name: monitor_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: monitor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: monitor_api
    restart: always
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - DB_HOST=db
      - DB_NAME=monitor_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_PORT=5432
    depends_on:
      - db

  scheduler:
    build: .
    container_name: monitor_scheduler
    restart: always
    command: python src/scheduler.py
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - DB_HOST=db
      - DB_NAME=monitor_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: